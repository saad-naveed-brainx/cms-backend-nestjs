# cms-api at api.nodepress.brainxdemo.com (deploy/README.md, step 7). The certificate is the
# wildcard for nodepress.brainxdemo.com from step 6.

server {
    listen 80;
    server_name api.nodepress.brainxdemo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.nodepress.brainxdemo.com;

    ssl_certificate     /etc/letsencrypt/live/nodepress.brainxdemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodepress.brainxdemo.com/privkey.pem;

    # Picture uploads: the API takes files up to 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
